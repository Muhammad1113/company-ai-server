# ===== company-ai: Nginx config (HTTP (LAN/test)) =====
# Windows: nginx.org se zip -> C:\nginx ; is file ko C:\nginx\conf\nginx.conf bana do.
# Check:  nginx -t      Start: start nginx      Reload: nginx -s reload      Stop: nginx -s quit
# Paths mein forward slash (/) use karo, backslash nahi.

worker_processes  auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # >= RAG_MAX_UPLOAD_MB (20) + thoda margin
    client_max_body_size 25m;

    # Rate limits (app ke andar bhi limits hain; ye pehli deewar hai)
    limit_req_zone  $binary_remote_addr zone=api:10m    rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m  rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream company_ai_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Frontend (build ke baad): frontend/dist. Path apna likho.
        root  C:/Users/sh/company-ai-server/frontend/dist;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Login: bohot sakht limit
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://company_ai_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API + SSE streaming (buffering band, lamba read timeout)
        location /api/ {
            limit_req  zone=api burst=60 nodelay;
            limit_conn perip 50;
            proxy_pass http://company_ai_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      300s;
            proxy_send_timeout      300s;
            gzip                    off;
        }

        location = /health { proxy_pass http://company_ai_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; }
        location = /ready  { proxy_pass http://company_ai_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; }

        # Sirf is machine se: metrics aur API docs bahar expose nahi
        location ~ ^/(metrics|docs|redoc|openapi\.json) {
            allow 127.0.0.1;
            allow ::1;
            deny  all;
            proxy_pass http://company_ai_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

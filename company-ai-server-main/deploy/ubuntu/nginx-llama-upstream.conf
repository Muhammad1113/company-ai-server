# GPU barhane par CODE badle baghair load balancing: har llama-server ek upstream; API ko sirf 127.0.0.1:8081 dikhta hai.
# Neeche example 2 GPU. Har llama-server ko alag port (9001, 9002) par chalao (CUDA_VISIBLE_DEVICES se GPU chuno).
# INFERENCE_MAX_CONCURRENT = un sab servers ke -np ka jod (2 servers x np 1 = 2).  Test: scripts/load_test.py
upstream llama_chat {
    least_conn;
    server 127.0.0.1:9001 max_fails=2 fail_timeout=15s;
    server 127.0.0.1:9002 max_fails=2 fail_timeout=15s;
}
server {
    listen 172.17.0.1:8081;
    location / {
        proxy_pass http://llama_chat;
        proxy_http_version 1.1;
        proxy_buffering off;          # SSE tokens
        proxy_read_timeout 300s;
    }
}

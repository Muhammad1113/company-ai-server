name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: company_ai
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: company_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U company_ai" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://company_ai:ci_password@127.0.0.1:5432/company_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      # -rs prints skipped tests: the Postgres integration tests must RUN here, not skip
      - run: python -m pytest tests -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node --test test/
      - run: npm run build
